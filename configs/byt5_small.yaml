seed: 42

model:
  name: google/byt5-small
  max_length: 128

training:
  epochs: 5
  batch_size: 16
  learning_rate: 0.0001
  gradient_accumulation_steps: 2
  warmup_steps: 100

evaluation:
  primary_metric: phoneme_error_rate
  eval_interval: 100
  save_interval: 200

early_stopping:
  patience: 2

output_dir: artifacts/checkpoints