name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/pronunciabench/ || true

      - name: Run tests
        run: pytest tests/ -v --tb=short -x

      - name: Run mini benchmark
        run: python -m pronunciabench.cli.main benchmark --dataset data/samples/test.jsonl --output /tmp/bench.json

      - name: Verify benchmark output
        run: python -c "import json; d=json.load(open('/tmp/bench.json')); assert 'reports' in d; assert d['n_examples'] > 0"